# The presence server's container image, for hosts who run their own
# Square with Docker (server/README.md, Host your own Net Square;
# deploy/selfhost/compose.yaml pulls it): server/Dockerfile built for
# x86-64 and ARM64 (a Raspberry Pi too) and pushed to the GitHub Container
# Registry as ghcr.io/OWNER/cyberworld-server, tagged with the release's
# version (0.16.0 and 0.16) and latest. A release runs it (release.yml, on
# its tag). The package is private when first pushed: its settings on
# GitHub make it public, once.
name: Server image

on:
  workflow_call:
    inputs:
      ref:
        description: The release's tag (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Server image (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cyberworld-server
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Cyberworld Net Square server
            org.opencontainers.image.description=The ROM-free Net Square server of Cyberworld Endless
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
