# Every push and pull request: the ROM-free checks and every build target.
# Nothing here has the ROM, so the game itself is not run; build.py drives
# the same builds as on a developer's machine. A push to main also publishes
# the browser build on GitHub Pages.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a newer push replaces a running check, but main finishes what it deploys
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOCKER_CONTEXT_NAME: ""   # build.py: the runner's own Docker, not Docker Desktop

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck -S warning linux/install.sh docker/mgba.sh docker/sdl2.sh docker/appimage.sh tools/android_key.sh ios/deps.sh
      - name: Python
        run: python3 -m py_compile build.py tools/*.py
      - name: Workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  code:
    # (issue #19: each against its baseline in tests/lint, which only shrinks)
    name: Code checks (analyzer, unreached functions, complexity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile, tag: cyberworld-build }
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.portmaster, tag: cyberworld-portmaster }
      - run: python3 build.py lint

  test:
    name: Unit tests (sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile, tag: cyberworld-build }
      - run: python3 build.py test

  handheld:
    name: PortMaster (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile, tag: cyberworld-build }
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.portmaster, tag: cyberworld-portmaster }
      - name: Host and aarch64 builds
        run: python3 build.py all
      # (every firmware PortMaster serves has glibc 2.30 or newer: ArkOS's is the oldest)
      - name: glibc 2.30 at most
        run: |
          v=$(docker run --rm -v "$PWD:/src" cyberworld-portmaster aarch64-linux-gnu-objdump -T /src/build/aarch64/cyberworld.aarch64 \
            | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "$v"
          [ "$(printf '%s\nGLIBC_2.30\n' "$v" | sort -V | tail -1)" = GLIBC_2.30 ]
      - name: Port folder and archive
        run: python3 build.py package
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-portmaster
          path: build/release/cyberworld-endless-portmaster.zip
          retention-days: 14

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.linux, tag: cyberworld-linux }
      - run: python3 build.py linux
      - name: Runs without the build image's libraries
        run: |
          tar xzf build/release/cyberworld-endless-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          ldd "$RUNNER_TEMP/cyberworld-endless-linux-x86_64/cyberworld-endless" | tee /dev/stderr | grep -q 'libSDL2-2.0.so.0 => .*/lib/libSDL2'
          out=$("$RUNNER_TEMP/cyberworld-endless-linux-x86_64/cyberworld-endless" --help 2>&1 || true)
          grep -q 'unknown argument' <<< "$out"
      - name: The AppImage and the .deb start
        run: |
          out=$(APPIMAGE_EXTRACT_AND_RUN=1 build/release/cyberworld-endless-x86_64.AppImage --help 2>&1 || true)
          grep -q 'unknown argument' <<< "$out"
          dpkg-deb -I build/release/cyberworld-endless_amd64.deb
          dpkg-deb -x build/release/cyberworld-endless_amd64.deb "$RUNNER_TEMP/deb"
          out=$("$RUNNER_TEMP/deb/usr/lib/cyberworld-endless/cyberworld-endless" --help 2>&1 || true)
          grep -q 'unknown argument' <<< "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-linux
          path: |
            build/release/cyberworld-endless-linux-x86_64.tar.gz
            build/release/cyberworld-endless-x86_64.AppImage
            build/release/cyberworld-endless_amd64.deb
          retention-days: 14

  windows:
    name: Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.windows, tag: cyberworld-windows }
      - run: python3 build.py windows
      - name: One .exe that needs only Windows' own DLLs, and an installer
        run: |
          file build/windows-stage/cyberworld-endless.exe | tee /dev/stderr | grep -q 'PE32+ executable.*(GUI).*x86-64'
          dlls=$(docker run --rm -v "$PWD:/src" -w /src cyberworld-windows \
            x86_64-w64-mingw32-objdump -p build/windows-stage/cyberworld-endless.exe | awk '/DLL Name/ { print tolower($3) }')
          echo "$dlls"
          if grep -vxE '(kernel32|user32|gdi32|advapi32|shell32|shlwapi|ole32|oleaut32|imm32|setupapi|version|winmm|comdlg32|msvcrt)\.dll' <<< "$dlls"; then
            echo "imports a DLL Windows does not have"; exit 1
          fi
          file build/release/cyberworld-endless-windows-x64-setup.exe | tee /dev/stderr | grep -q 'Nullsoft Installer'
          unzip -l build/release/cyberworld-endless-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-windows
          path: |
            build/release/cyberworld-endless-windows-x64.zip
            build/release/cyberworld-endless-windows-x64-setup.exe
          retention-days: 14

  n3ds:
    name: Nintendo 3DS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.3ds, tag: cyberworld-3ds }
      - run: python3 build.py 3ds
      - name: A .3dsx for the Homebrew Launcher and a CIA for the HOME Menu
        run: |
          f=build/3ds/cyberworld-endless.3dsx
          test "$(head -c 4 "$f")" = 3DSX
          # (a CIA opens with its header's size, 0x2020)
          c=build/3ds/cyberworld-endless.cia
          test "$(head -c 4 "$c" | od -An -tx1 | tr -d ' ')" = 20200000
          ls -l "$f" "$c"
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-3ds
          path: |
            build/3ds/cyberworld-endless.3dsx
            build/3ds/cyberworld-endless.cia
          retention-days: 14

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.android, tag: cyberworld-android }
      - uses: actions/cache@v4
        with:
          path: .build/gradle-home
          key: gradle-${{ hashFiles('android/**/*.gradle') }}
      - run: python3 build.py android
      - name: Save folder provider failures
        run: python3 tests/test_android_saves.py --docker
      - name: One APK for arm64, 32-bit ARM and x86-64, starting at RomActivity
        run: |
          unzip -l build/release/cyberworld-endless.apk | tee /dev/stderr | grep -c 'lib/.*/libmain.so' | grep -qx 3
          docker run --rm -v "$PWD:/src" -w /src cyberworld-android \
            /opt/android-sdk/build-tools/35.0.0/aapt2 dump badging build/release/cyberworld-endless.apk \
            | tee /dev/stderr | grep -q "launchable-activity: name='io.github.saschb2b.cyberworldendless.RomActivity'"
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-android
          path: build/release/cyberworld-endless.apk
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # (SDL2 and mGBA, universal and static: rebuilt when macos/deps.sh changes)
      - uses: actions/cache@v4
        with:
          path: .build/macos-deps
          key: macos-deps-macos15-${{ hashFiles('macos/deps.sh') }}
      - run: python3 build.py macos
      - name: One app for Apple silicon and Intel that starts
        run: |
          app="build/macos/Cyberworld Endless.app"
          bin="$app/Contents/MacOS/cyberworld-endless"
          lipo -archs "$bin" | tee /dev/stderr | grep -q 'x86_64 arm64'
          # (a line per library under each architecture's header)
          if otool -L "$bin" | grep -E '^[[:space:]]' | grep -vE '^[[:space:]]+(/System/Library/|/usr/lib/)'; then
            echo "links a library macOS does not have"; exit 1
          fi
          codesign --verify --deep --strict "$app"
          "$bin" --headless --scene launcher --data-dir "$RUNNER_TEMP/data" --frames 30 --shot "20:$RUNNER_TEMP/launcher.bmp"
          test -s "$RUNNER_TEMP/launcher.bmp"
          hdiutil verify build/release/cyberworld-endless-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-macos
          path: build/release/cyberworld-endless-macos.dmg
          retention-days: 14

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build/ios-deps
          key: ios-deps-macos15-${{ hashFiles('ios/deps.sh') }}
      - name: The IPA for iPhone and iPad
        run: python3 build.py ios
      - name: One arm64 app for iOS 14 on that links only iOS's own frameworks
        run: |
          app=build/ios-iphoneos/Payload/CyberworldEndless.app
          bin="$app/cyberworld-endless"
          lipo -archs "$bin" | tee /dev/stderr | grep -qx arm64
          otool -l "$bin" | grep -A4 LC_BUILD_VERSION | tee /dev/stderr | grep -q 'minos 14.0'
          if otool -L "$bin" | grep -E '^[[:space:]]' | grep -vE '^[[:space:]]+(/System/Library/|/usr/lib/)'; then
            echo "links a library iOS does not have"; exit 1
          fi
          plutil -lint "$app/Info.plist"
          codesign --verify --deep --strict "$app"
          unzip -l build/release/cyberworld-endless.ipa | tee /dev/stderr | grep -q 'Payload/CyberworldEndless.app/cyberworld-endless$'
      - name: The Simulator's app
        run: python3 build.py ios --simulator
      - name: It starts in the iOS Simulator, on the ROMs screen
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for k, v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/ios-iphonesimulator/Payload/CyberworldEndless.app
          xcrun simctl launch --stdout="$RUNNER_TEMP/ios.out" --stderr="$RUNNER_TEMP/ios.err" "$udid" io.github.saschb2b.cyberworldendless
          sleep 20
          mkdir -p build/ios-shots
          xcrun simctl io "$udid" screenshot build/ios-shots/launcher.png
          cat "$RUNNER_TEMP/ios.out" "$RUNNER_TEMP/ios.err"
          grep -q '^display ' "$RUNNER_TEMP/ios.out"
          xcrun simctl spawn "$udid" launchctl list | grep -q cyberworldendless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyberworld-ios
          path: |
            build/release/cyberworld-endless.ipa
            build/ios-shots
          retention-days: 14

  web:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.web, tag: cyberworld-web }
      - run: python3 build.py web
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-web
          path: build/site
          include-hidden-files: true
          retention-days: 14
      - name: Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  pages:
    name: Publish on GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, handheld, linux, windows, android, macos, ios, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
