# Every push and pull request: the ROM-free checks and every build target.
# Nothing here has the ROM, so the game itself is not run; build.py drives
# the same builds as on a developer's machine. A push to main also publishes
# the browser build on GitHub Pages.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a newer push replaces a running check, but main finishes what it deploys
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOCKER_CONTEXT_NAME: ""   # build.py: the runner's own Docker, not Docker Desktop

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck -S warning linux/install.sh docker/mgba.sh docker/sdl2.sh docker/appimage.sh tools/android_key.sh
      - name: Python
        run: python3 -m py_compile build.py tools/*.py
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  test:
    name: Unit tests (sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile, tag: cyberworld-build }
      - run: python3 build.py test

  handheld:
    name: ROCKNIX (PortMaster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile, tag: cyberworld-build }
      - name: Host and aarch64 builds
        run: python3 build.py all
      - name: Port archive
        run: python3 build.py package && mkdir -p build/release && (cd build/port && zip -qr ../release/cyberworld.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-portmaster
          path: build/release/cyberworld.zip
          retention-days: 14

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.linux, tag: cyberworld-linux }
      - run: python3 build.py linux
      - name: Runs without the build image's libraries
        run: |
          tar xzf build/release/cyberworld-endless-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          ldd "$RUNNER_TEMP/cyberworld-endless-linux-x86_64/cyberworld-endless" | tee /dev/stderr | grep -q 'libSDL2-2.0.so.0 => .*/lib/libSDL2'
          out=$("$RUNNER_TEMP/cyberworld-endless-linux-x86_64/cyberworld-endless" --help 2>&1 || true)
          grep -q 'unknown argument' <<< "$out"
      - name: The AppImage and the .deb start
        run: |
          out=$(APPIMAGE_EXTRACT_AND_RUN=1 build/release/cyberworld-endless-x86_64.AppImage --help 2>&1 || true)
          grep -q 'unknown argument' <<< "$out"
          dpkg-deb -I build/release/cyberworld-endless_amd64.deb
          dpkg-deb -x build/release/cyberworld-endless_amd64.deb "$RUNNER_TEMP/deb"
          out=$("$RUNNER_TEMP/deb/usr/lib/cyberworld-endless/cyberworld-endless" --help 2>&1 || true)
          grep -q 'unknown argument' <<< "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-linux
          path: |
            build/release/cyberworld-endless-linux-x86_64.tar.gz
            build/release/cyberworld-endless-x86_64.AppImage
            build/release/cyberworld-endless_amd64.deb
          retention-days: 14

  windows:
    name: Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.windows, tag: cyberworld-windows }
      - run: python3 build.py windows
      - name: One .exe that needs only Windows' own DLLs, and an installer
        run: |
          file build/windows-stage/cyberworld-endless.exe | tee /dev/stderr | grep -q 'PE32+ executable.*(GUI).*x86-64'
          dlls=$(docker run --rm -v "$PWD:/src" -w /src cyberworld-windows \
            x86_64-w64-mingw32-objdump -p build/windows-stage/cyberworld-endless.exe | awk '/DLL Name/ { print tolower($3) }')
          echo "$dlls"
          if grep -vxE '(kernel32|user32|gdi32|advapi32|shell32|shlwapi|ole32|oleaut32|imm32|setupapi|version|winmm|comdlg32|msvcrt)\.dll' <<< "$dlls"; then
            echo "imports a DLL Windows does not have"; exit 1
          fi
          file build/release/cyberworld-endless-setup-x64.exe | tee /dev/stderr | grep -q 'Nullsoft Installer'
          unzip -l build/release/cyberworld-endless-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-windows
          path: |
            build/release/cyberworld-endless-windows-x64.zip
            build/release/cyberworld-endless-setup-x64.exe
          retention-days: 14

  n3ds:
    name: Nintendo 3DS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.3ds, tag: cyberworld-3ds }
      - run: python3 build.py 3ds
      - name: A .3dsx for the Homebrew Launcher and a CIA for the HOME Menu
        run: |
          f=build/3ds/cyberworld-endless.3dsx
          test "$(head -c 4 "$f")" = 3DSX
          # (a CIA opens with its header's size, 0x2020)
          c=build/3ds/cyberworld-endless.cia
          test "$(head -c 4 "$c" | od -An -tx1 | tr -d ' ')" = 20200000
          ls -l "$f" "$c"
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-3ds
          path: |
            build/3ds/cyberworld-endless.3dsx
            build/3ds/cyberworld-endless.cia
          retention-days: 14

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.android, tag: cyberworld-android }
      - uses: actions/cache@v4
        with:
          path: .build/gradle-home
          key: gradle-${{ hashFiles('android/**/*.gradle') }}
      - run: python3 build.py android
      - name: One APK for arm64, 32-bit ARM and x86-64, starting at RomActivity
        run: |
          unzip -l build/release/cyberworld-endless.apk | tee /dev/stderr | grep -c 'lib/.*/libmain.so' | grep -qx 3
          docker run --rm -v "$PWD:/src" -w /src cyberworld-android \
            /opt/android-sdk/build-tools/35.0.0/aapt2 dump badging build/release/cyberworld-endless.apk \
            | tee /dev/stderr | grep -q "launchable-activity: name='io.github.saschb2b.cyberworldendless.RomActivity'"
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-android
          path: build/release/cyberworld-endless.apk
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # (SDL2 and mGBA, universal and static: rebuilt when macos/deps.sh changes)
      - uses: actions/cache@v4
        with:
          path: .build/macos-deps
          key: macos-deps-${{ hashFiles('macos/deps.sh') }}
      - run: python3 build.py macos
      - name: One app for Apple silicon and Intel that starts
        run: |
          app="build/macos/Cyberworld Endless.app"
          bin="$app/Contents/MacOS/cyberworld-endless"
          lipo -archs "$bin" | tee /dev/stderr | grep -q 'x86_64 arm64'
          # (a line per library under each architecture's header)
          if otool -L "$bin" | grep -E '^[[:space:]]' | grep -vE '^[[:space:]]+(/System/Library/|/usr/lib/)'; then
            echo "links a library macOS does not have"; exit 1
          fi
          codesign --verify --deep --strict "$app"
          "$bin" --headless --scene norom --data-dir "$RUNNER_TEMP/data" --frames 30 --shot "20:$RUNNER_TEMP/norom.bmp"
          test -s "$RUNNER_TEMP/norom.bmp"
          hdiutil verify build/release/cyberworld-endless-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-macos
          path: build/release/cyberworld-endless-macos.dmg
          retention-days: 14

  web:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.web, tag: cyberworld-web }
      - run: python3 build.py web
      - uses: actions/upload-artifact@v4
        with:
          name: cyberworld-web
          path: build/site
          include-hidden-files: true
          retention-days: 14
      - name: Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  pages:
    name: Publish on GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, handheld, linux, windows, android, macos, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
