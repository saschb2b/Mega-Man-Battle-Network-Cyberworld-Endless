# A version tag (v1.0.0) builds the three release archives and publishes
# them as a GitHub release: the PortMaster port, the Linux desktop build and
# the browser build as a site to serve anywhere. None holds game data.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_CONTEXT_NAME: ""
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile, tag: cyberworld-build }
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.linux, tag: cyberworld-linux }
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.web, tag: cyberworld-web }
      - run: python3 build.py test
      - run: python3 build.py release
      - name: Checksums
        working-directory: build/release
        run: sha256sum cyberworld.zip cyberworld-endless-linux-x86_64.tar.gz cyberworld-endless-web.zip > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" --verify-tag --generate-notes --title "Cyberworld Endless $TAG"
          build/release/cyberworld.zip build/release/cyberworld-endless-linux-x86_64.tar.gz
          build/release/cyberworld-endless-web.zip build/release/SHA256SUMS.txt
