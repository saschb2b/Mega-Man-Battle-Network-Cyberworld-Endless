# A version tag (v1.0.0) builds the release files and publishes them as a
# GitHub release: the PortMaster port, the Linux desktop build (AppImage with
# its .zsync, .deb and tar.gz, and a Flatpak bundle), the Windows build (an
# installer and a zip), the macOS app (a .dmg) and the browser build as a
# site to serve anywhere.
# None holds game data.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_CONTEXT_NAME: ""
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # the Flatpak (linux/flatpak), in Flathub's builder image
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: cyberworld-endless.flatpak
          manifest-path: linux/flatpak/io.github.saschb2b.Mega-Man-Battle-Network-Cyberworld-Endless.yml
          upload-artifact: false
          cache: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: cyberworld-endless.flatpak

  # the macOS app, on a Mac (Apple's SDK)
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: python3 build.py macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/release/cyberworld-endless-macos.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.android, tag: cyberworld-android }
      # one key for every release (android/README.md, tools/android_key.sh):
      # without the secrets no APK is released, rather than one signed with
      # a key the next release could not match (players would reinstall and
      # lose their saves to update)
      - name: The APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::No Android release key in the repository's secrets: this release has no APK"
            exit 0
          fi
          mkdir -p .build && echo "$KEYSTORE_BASE64" | base64 -d > .build/release.jks
          export ANDROID_KEYSTORE=/src/.build/release.jks
          python3 build.py android
          rm -f .build/release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/release/cyberworld-endless.apk
          if-no-files-found: ignore

  release:
    needs: [flatpak, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile, tag: cyberworld-build }
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.linux, tag: cyberworld-linux }
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.web, tag: cyberworld-web }
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.windows, tag: cyberworld-windows }
      - run: python3 build.py test
      - run: python3 build.py release
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: build/release
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: build/release
      # (none when the release has no APK)
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android
          path: build/release
      - name: Checksums
        working-directory: build/release
        run: |
          ls cyberworld.zip cyberworld-endless-x86_64.AppImage cyberworld-endless_amd64.deb \
            cyberworld-endless-linux-x86_64.tar.gz cyberworld-endless.flatpak cyberworld-endless-setup-x64.exe \
            cyberworld-endless-windows-x64.zip cyberworld-endless-macos.dmg cyberworld-endless.apk cyberworld-endless-web.zip \
            2>/dev/null > FILES || true
          sha256sum $(cat FILES) > SHA256SUMS.txt
      # the players' notes (docs/releases/TAG.md, else the CHANGELOG's
      # section); a 0.x version is an alpha, published as a pre-release
      - name: Notes
        run: python3 tools/release_notes.py "$TAG" > build/release/NOTES.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          title="Cyberworld Endless $TAG"
          case "$TAG" in v0.*) flags+=(--prerelease); title="$title (alpha)";; esac
          files=(build/release/cyberworld-endless-x86_64.AppImage.zsync build/release/SHA256SUMS.txt)
          while read -r f; do files+=("build/release/$f"); done < build/release/FILES
          gh release create "$TAG" --verify-tag --notes-file build/release/NOTES.md "${flags[@]}" --title "$title" "${files[@]}"
