# A version tag (v1.0.0) builds the release files and publishes them as a
# GitHub release: the PortMaster port, the Linux desktop build (AppImage with
# its .zsync, .deb and tar.gz, and a Flatpak bundle), the Windows build (an
# installer and a zip) and the browser build as a site to serve anywhere.
# None holds game data.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_CONTEXT_NAME: ""
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # the Flatpak (linux/flatpak), in Flathub's builder image
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: cyberworld-endless.flatpak
          manifest-path: linux/flatpak/io.github.saschb2b.Mega-Man-Battle-Network-Cyberworld-Endless.yml
          upload-artifact: false
          cache: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: cyberworld-endless.flatpak

  release:
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile, tag: cyberworld-build }
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.linux, tag: cyberworld-linux }
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.web, tag: cyberworld-web }
      - uses: ./.github/actions/image
        with: { dockerfile: Dockerfile.windows, tag: cyberworld-windows }
      - run: python3 build.py test
      - run: python3 build.py release
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: build/release
      - name: Checksums
        working-directory: build/release
        run: >
          sha256sum cyberworld.zip cyberworld-endless-x86_64.AppImage cyberworld-endless_amd64.deb
          cyberworld-endless-linux-x86_64.tar.gz cyberworld-endless.flatpak cyberworld-endless-setup-x64.exe
          cyberworld-endless-windows-x64.zip cyberworld-endless-web.zip > SHA256SUMS.txt
      # the players' notes (docs/releases/TAG.md, else the CHANGELOG's
      # section); a 0.x version is an alpha, published as a pre-release
      - name: Notes
        run: python3 tools/release_notes.py "$TAG" > build/release/NOTES.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          title="Cyberworld Endless $TAG"
          case "$TAG" in v0.*) flags+=(--prerelease); title="$title (alpha)";; esac
          gh release create "$TAG" --verify-tag --notes-file build/release/NOTES.md "${flags[@]}" --title "$title" \
            build/release/cyberworld.zip build/release/cyberworld-endless-x86_64.AppImage \
            build/release/cyberworld-endless-x86_64.AppImage.zsync build/release/cyberworld-endless_amd64.deb \
            build/release/cyberworld-endless-linux-x86_64.tar.gz build/release/cyberworld-endless.flatpak \
            build/release/cyberworld-endless-setup-x64.exe build/release/cyberworld-endless-windows-x64.zip \
            build/release/cyberworld-endless-web.zip build/release/SHA256SUMS.txt
