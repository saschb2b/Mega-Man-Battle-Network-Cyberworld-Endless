# The ROM-free presence server, on a push or pull request that touches it
# (server/, its wire contract in shared/online/, its deployment in deploy/,
# or these workflows): its tests on the oldest Python it supports, the
# zipapp's real process smoke and the Coolify deployment's image, on Linux.
# CI's unit tests (build.py test) run the same suite on every change, beside
# the C client's contract. The five native builds run for a release
# (release.yml) or by hand here (Run workflow).
name: Server

on:
  push:
    branches: [main, dev]
    paths:
      - 'server/**'
      - 'shared/online/**'
      - 'deploy/**'
      - '.github/workflows/server.yml'
      - '.github/workflows/server-native.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'shared/online/**'
      - 'deploy/**'
      - '.github/workflows/server.yml'
      - '.github/workflows/server-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Server protocol and moderation tests
        run: python -m unittest discover -s server/tests -v
      - name: Python source bundle and real process smoke
        run: python server/release.py
      - name: Coolify deployment (Compose file and image)
        run: |
          docker compose --project-directory . -f deploy/coolify/compose.yaml config --quiet
          docker compose --project-directory . -f deploy/coolify/compose.yaml build
      # (deploy/selfhost/: its Compose file, and the image started as a
      # host starts it, with nothing set, answering /health)
      - name: Self-hosting (Compose file and the image's bare start)
        run: |
          DOMAIN=square.example.com docker compose -f deploy/selfhost/compose.yaml config --quiet
          docker build -f server/Dockerfile -t cyberworld-server-check .
          docker run -d --name square-check -p 127.0.0.1:18765:8765 cyberworld-server-check
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:18765/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18765/health | grep -q '"status": *"ok"'
          docker logs square-check 2>&1 | grep -q 'is open on port 8765'
          docker rm -f square-check

  native:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/server-native.yml
