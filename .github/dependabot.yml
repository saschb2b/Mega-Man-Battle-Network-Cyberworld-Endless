# Keeps the workflow actions and the build images' base images current;
# its PRs target dev, as every PR does (AGENTS.md, Pull requests).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /docker
    target-branch: dev
    schedule: { interval: monthly }
