name: Build image
description: >
  Builds one of the build images in docker/ with Buildx, cached in the
  GitHub Actions cache, and loads it under the name build.py expects.
inputs:
  dockerfile:
    description: Dockerfile in docker/
    required: true
  tag:
    description: Image name build.py uses
    required: true
runs:
  using: composite
  steps:
    # BuildKit is pulled by Docker before BuildKit's own mirrors apply.
    # Google's cache can evict an image, so retain the upstream fallback.
    - name: Prepare BuildKit
      id: buildkit
      shell: bash
      run: |
        image=moby/buildkit:buildx-stable-1
        if timeout 120s docker pull "mirror.gcr.io/$image"; then
          echo "image=mirror.gcr.io/$image" >> "$GITHUB_OUTPUT"
        else
          echo "image=$image" >> "$GITHUB_OUTPUT"
        fi
    - uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=${{ steps.buildkit.outputs.image }}
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
    - uses: docker/build-push-action@v6
      with:
        context: docker
        file: docker/${{ inputs.dockerfile }}
        tags: ${{ inputs.tag }}
        load: true
        cache-from: type=gha,scope=${{ inputs.tag }}
        cache-to: type=gha,mode=max,scope=${{ inputs.tag }}
