# Your own Net Square on the internet, with HTTPS (server/README.md, Host
# your own Net Square). On a server with Docker, a domain whose DNS record
# points at it, and ports 80 and 443 open to the internet:
#
#   curl -fsSLO https://raw.githubusercontent.com/saschb2b/Mega-Man-Battle-Network-Cyberworld-Endless/main/deploy/selfhost/compose.yaml
#   echo "DOMAIN=square.example.com" > .env
#   docker compose up -d
#
# Players then give the gate's keeper square.example.com. Caddy gets the
# certificate from Let's Encrypt (the one authority the 3DS build trusts)
# and renews it; the browser game comes in too. More of .env, each optional:
# NAME and MOTD (the Square's name and welcome in /health), SEED (another
# seed is another Square: its plaza and its week's DeepNet), VERSION (an
# image tag, 0.16.0 say, rather than the latest release). Update with
# `docker compose pull && docker compose up -d`; the state stays in its
# volume. Needs Docker Compose 2.23.1 or newer (the Caddyfile below is inline).
name: cyberworld-square

services:
  # The Net Square server: the latest release's image, or built from the
  # repository's main where the image cannot be pulled.
  square:
    image: ghcr.io/saschb2b/cyberworld-server:${VERSION:-latest}
    build:
      context: https://github.com/saschb2b/Mega-Man-Battle-Network-Cyberworld-Endless.git#main
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      CYBERWORLD_SERVER_NAME: ${NAME:-Cyberworld Endless}
      CYBERWORLD_SERVER_MOTD: ${MOTD:-Welcome to the Net Square}
      CYBERWORLD_SERVER_SEED: ${SEED:-120}
    expose:
      - "8765"
    volumes:
      - state:/data
      # (read-only: a restore is run from this container, server/README.md)
      - backups:/backups:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # The state's daily archive (server/README.md, Backups and restores): the
  # server's key, its moderation and the Board, kept 14 days.
  backup:
    image: ghcr.io/saschb2b/cyberworld-server:${VERSION:-latest}
    build:
      context: https://github.com/saschb2b/Mega-Man-Battle-Network-Cyberworld-Endless.git#main
      dockerfile: server/Dockerfile
    restart: unless-stopped
    command: ["--state-dir", "/data", "--backup", "/backups"]
    volumes:
      - state:/data:ro
      - backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  # HTTPS in front: wss://DOMAIN/presence to the server. Caddy keeps no
  # access log, so no player's address is written down.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - square
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

configs:
  caddyfile:
    content: |
      {
          cert_issuer acme https://acme-v02.api.letsencrypt.org/directory
      }
      ${DOMAIN:?set DOMAIN in .env to this server's domain, e.g. DOMAIN=square.example.com} {
          reverse_proxy square:8765
      }

volumes:
  state:
  backups:
  caddy-data:
  caddy-config:
