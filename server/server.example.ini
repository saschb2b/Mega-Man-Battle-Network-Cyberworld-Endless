[server]
# Local Phase 0 proof. Bind 0.0.0.0 only when deliberately exposing the service.
host = 127.0.0.1
port = 8765
seed = 120
capacity = 8
tick_hz = 20
# Browser Origins are exact matches; an empty list allows native clients only.
origins =
# Public endpoints need TLS here or a reverse proxy terminating wss://.
# tls_certificate = /run/secrets/server-cert.pem
# tls_key = /run/secrets/server-key.pem
