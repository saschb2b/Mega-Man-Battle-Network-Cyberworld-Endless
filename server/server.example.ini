# The Net Square server's settings (server/README.md). The server needs
# none of them: started bare, it opens a Square on every interface of this
# computer, port 8765. To change one, copy this file to server.ini beside
# the server (or in the folder it starts in), edit it and restart; --config
# names another file. Each line shows its default. Any of them can be set
# in the environment too, which wins over the file: CYBERWORLD_SERVER_SEED=7
# for `seed = 7`.
[server]
# The Square's name and its line of welcome, as /health shows them.
name = Cyberworld Endless
motd = Welcome to the Net Square
# Where it listens: empty, every interface (other games on this network,
# and through a router's forwarded port); 127.0.0.1, this computer alone.
host =
port = 8765
# The Square's seed: its plaza's shape and landmark, and the start of its
# week's DeepNet. Another seed is another Square.
seed = 120
# Players in a channel (1-8), and in the whole Square: past a channel's
# capacity another opens, up to player_cap.
capacity = 8
player_cap = 64
tick_hz = 20
# The server's private state: its key, moderation, the week's Board. Keep it
# across updates and never share it (relative to the folder it starts in).
state_dir = server-data
# Public profile IDs, separated by spaces. Empty allows all unbanned guests.
whitelist =
# Quick phrases and emotes only: free_text = true refuses to start.
free_text = false
trading = true
arena = true
# The browser pages whose game may come in, exact origins separated by
# spaces: the published game's by default. A browser game needs wss://
# (a certificate below, or a proxy in front). Empty: native games alone.
origins = https://saschb2b.github.io
# A certificate for wss:// here, or leave both out behind a TLS proxy
# (deploy/selfhost/ sets one up with Caddy and Let's Encrypt).
# tls_certificate = /run/secrets/server-cert.pem
# tls_key = /run/secrets/server-key.pem
# What the state directory keeps and for how long (README.md, What is kept):
# the trades' log in days (0: none written), the Board's weeks (2 at least:
# this week and the last), the players' log in days (0: none written), and
# the archives of --backup in days, and the daily totals (stats.jsonl, no
# names) in days (0: none written).
trade_days = 14
board_weeks = 2
log_days = 14
backup_days = 14
stats_days = 365
# Under maintenance: every game that comes is turned away at the gate with
# this line (at most 40 printable characters), e.g. "until 14:00 UTC"; empty
# or absent: open. Read at the start: set it, then restart.
maintenance =
