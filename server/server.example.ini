[server]
name = Cyberworld Endless
motd = Welcome to the Net Square
# Local development. In a container bind 0.0.0.0 behind the TLS proxy.
host = 127.0.0.1
port = 8765
seed = 120
capacity = 8
player_cap = 64
tick_hz = 20
state_dir = server-data
# Public profile IDs, separated by spaces. Empty allows all unbanned guests.
whitelist =
# These remain off in Phase 1; enabling an unimplemented feature fails startup.
free_text = false
trading = true
arena = true
# Browser Origins are exact matches; an empty list allows native clients only.
origins =
# Public endpoints need TLS here or a reverse proxy terminating wss://.
# tls_certificate = /run/secrets/server-cert.pem
# tls_key = /run/secrets/server-key.pem
# What the state directory keeps and for how long (README.md, What is kept):
# the trades' log in days (0: none written), the Board's weeks (2 at least:
# this week and the last), the players' log in days (0: none written), and
# the archives of --backup in days, and the daily totals (stats.jsonl, no
# names) in days (0: none written).
trade_days = 14
board_weeks = 2
log_days = 14
backup_days = 14
stats_days = 365
