# Coolify Base Directory=/, Compose Location=/server/compose.coolify.yaml.
# Local commands must use --project-directory . from the repository root.
# Preserve repository during deployment keeps the read-only config mount.
# Coolify terminates HTTPS/WebSocket TLS.
# Set the service's domain to https://cyberworld.saschb2b.com and port to 8765.
services:
  cyberworld:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--config", "/app/server.ini", "--state-dir", "/data"]
    expose:
      - "8765"
    volumes:
      - cyberworld-state:/data
      - ./server/server.coolify.ini:/app/server.ini:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  cyberworld-state:
