<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Net Square browser probe</title>
<style>
body { background: #101d2c; color: #e6f5ff; font: 16px sans-serif; max-width: 800px; margin: 2em auto; }
label { display: block; margin: 1em 0; } input { min-width: 280px; } canvas { image-rendering: pixelated; }
pre { white-space: pre-wrap; font-size: 12px; }
</style>
<h1>Net Square browser probe</h1>
<p>Developer test only. Your ROM is read into this tab's memory and never uploaded or persisted.</p>
<label>Server <input id="endpoint" value="ws://127.0.0.1:8765/presence"></label>
<label>Name <input id="name" value="Browser" maxlength="16"></label>
<label>BN6 Gregar USA ROM <input id="rom" type="file" accept=".gba"></label>
<label>BN5 Team Colonel USA ROM, for the full NetPass (NetBattles, trades, the dive) <input id="bn5" type="file" accept=".gba"></label>
<button id="start" disabled>Start a run and step onto the gate</button>
<p id="status" role="status">Loading the game build…</p>
<canvas id="canvas" width="720" height="480" tabindex="0" aria-label="Game"></canvas>
<pre id="log"></pre>
<script>
const statusLine = document.getElementById('status');
const startButton = document.getElementById('start');
const log = text => {
    const box = document.getElementById('log');
    box.textContent = (box.textContent + text + '\n').split('\n').slice(-40).join('\n');
};
var Module = {
    canvas: document.getElementById('canvas'),
    print: log, printErr: log,
    onRuntimeInitialized: () => { statusLine.textContent = 'Choose your ROM, then connect.'; startButton.disabled = false; },
    preRun: [() => { ENV.CYBERWORLD_ONLINE_TRACE = '/online-trace.jsonl'; }],
};
startButton.onclick = async () => {
    const file = document.getElementById('rom').files[0];
    if (!file) { statusLine.textContent = 'Choose your own BN6 Gregar USA ROM first.'; return; }
    startButton.disabled = true;
    try {
        Module.FS.mkdir('/rom'); Module.FS.mkdir('/visit');
        Module.FS.writeFile('/rom/bn6.gba', new Uint8Array(await file.arrayBuffer()));
        const bn5 = document.getElementById('bn5').files[0];
        if (bn5) Module.FS.writeFile('/rom/bn5.gba', new Uint8Array(await bn5.arrayBuffer()));
        statusLine.textContent = 'In the Net Square once the gate connects. Reload to start another visit.';
        // (a run at home, through the gate's questions onto the gate, the
        // server and name given by --dev: docs/online/two-games.md)
        const dev = 'quiet,online=' + document.getElementById('endpoint').value + ',onlinename=' + document.getElementById('name').value;
        Module.callMain(['--rom-dir', '/rom', '--data-dir', '/visit', '--window', '--size', '720x480',
            '--scene', 'home', '--run-depth', '7', '--seed', '3', '--dev', dev,
            '--input', '450:,4:A,60:,4:A,60:,4:A,60:,4:A,60:,1:place 16 72 3,120:,4:LEFT,30:,4:A,300:']);
    } catch (error) { statusLine.textContent = String(error); }
};
</script>
<script src="../build/web/cyberworld.js"></script>
</html>
